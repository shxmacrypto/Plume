[package]
name = "plume"
version = "0.6.0"
edition = "2024"
build = "build.rs"

[dependencies]
tao = "0.34"
wry = { version = "0.53", features = ["devtools"] }
webview2-com = "0.38"
serde_json = "1"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "getrandom"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
miniz_oxide = "0.8"
sha2 = "0.10"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Com_Urlmon",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Networking_WinInet",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
