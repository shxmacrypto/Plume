[package]
name = "plume"
version = "0.6.1"
edition = "2024"
build = "build.rs"

[dependencies]
tao = "0.34"
wry = { version = "0.53", features = ["devtools"] }
webview2-com = "0.38"
serde_json = "1"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "getrandom"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
miniz_oxide = "0.8"
sha2 = "0.10"
sha1 = "0.10"
windows-future = "0.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Com_Urlmon",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Networking_WinInet",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_WinRT",
    "Foundation",
    "Security_Credentials",
    "Security_Credentials_UI",
    "Security_Cryptography",
    "Storage_Streams",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# wry avec le nom de profil WebView2 (conteneurs, #19) : voir vendor/wry/PLUME.md
[patch.crates-io]
wry = { path = "vendor/wry" }
