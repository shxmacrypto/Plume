# Plume Suite : toutes les applications (apps/) et leurs bibliothèques (crates/) partagent un espace de travail et
# une seule version, ci-dessous (release.ps1 la change). `cargo build --release` construit Plume Web seul ; les autres :
# `cargo build --release -p plume-suite`, `-p plume-fex`, `-p plume-mail`.
[workspace]
resolver = "3"
members = ["apps/web", "apps/suite", "apps/fex", "apps/mail", "apps/viewer", "apps/music", "apps/convert", "apps/calendar", "apps/pdf", "apps/clipboard", "apps/backup", "apps/clean", "apps/task", "apps/media", "apps/passwords", "apps/launcher", "apps/drop", "apps/notepad", "apps/cut", "apps/boost", "apps/create", "crates/fex-core", "crates/mail-core", "crates/plume-ui", "crates/plume-update", "crates/plume-defaults"]

default-members = ["apps/web"]
exclude = ["launcher", "vendor/wry"]

[workspace.package]
version = "1.2.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Plume FEx : la vitesse (liste, tri, recherche) passe avant la taille de l'exe
[profile.release.package.fex-core]
opt-level = 3
[profile.release.package.plume-fex]
opt-level = 3

# Construction rapide pour les essais de Plume FEx (pas de LTO) : `cargo build --profile fast -p plume-fex`
[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
strip = false

# wry avec le nom de profil WebView2 (conteneurs, #19) : voir vendor/wry/PLUME.md
[patch.crates-io]
wry = { path = "vendor/wry" }
