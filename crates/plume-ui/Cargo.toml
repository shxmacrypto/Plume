[package]
name = "plume-ui"
version.workspace = true
edition = "2024"
description = "The native interface kit of the Plume apps: frameless window, Direct2D drawing, DirectWrite text, Plume theme and icons."
license = "MIT"

[features]
# Essais automatiques : les boîtes de dialogue de Windows ne s'ouvrent pas (voir `dialogs`). Jamais publié.
test-hook = []

[dependencies]
windows-numerics = "0.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
