<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plume Boost: the Plume feather taking off, speed lines trailing behind it, on electric cyan. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset=".5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#g)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#s)"/>
  <!-- speed lines, parallel to the feather's flight -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path stroke-opacity=".7" stroke-width="3.6" d="M9.5 38.5 16 31"/>
    <path stroke-opacity=".95" stroke-width="3.6" d="M12 50.5 21.5 39.5"/>
    <path stroke-opacity=".7" stroke-width="3.6" d="M24 54.5 30.5 47"/>
  </g>
  <!-- the feather, quill down-left, tip up-right -->
  <g transform="translate(5.5 -1.5) scale(1.04)">
    <path fill="#fff" d="M48.5 12.5c-12.6 1.2-23.4 9.6-26.6 22.4l-1.4 6.6 6.4-1.6c4.6-1.2 8.6-3.6 11.6-7.2l-6.2-.6 8.8-3.6c3.8-4.6 7-10 7.4-16z"/>
    <path fill="none" stroke="#0891b2" stroke-width="2.6" stroke-linecap="round" d="M25 37.5C30 28 36 21 44.5 15.5"/>
    <path fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round" d="M15.5 50 23.5 40.5"/>
  </g>
</svg>
