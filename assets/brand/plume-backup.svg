<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plume Backup: the Plume feather inside a circling arrow (a copy that comes round again), on green. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset=".5" stop-color="#059669"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#g)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#s)"/>
  <!-- the circling arrow: from the top right all the way round, its head pointing back to where it started -->
  <path fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" d="M43.6 19.4A18 18 0 1 1 22.9 17.4"/>
  <path fill="#fff" d="M29.4 13.7 19.2 13.1 24.6 22.6z"/>
  <!-- the feather, in the middle -->
  <g transform="translate(32.4 33.4) scale(.6) translate(-31.75 -31.5)">
    <path fill="#fff" d="M48.5 12.5c-12.6 1.2-23.4 9.6-26.6 22.4l-1.4 6.6 6.4-1.6c4.6-1.2 8.6-3.6 11.6-7.2l-6.2-.6 8.8-3.6c3.8-4.6 7-10 7.4-16z"/>
    <path fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" d="M25 37.5C30 28 36 21 44.5 15.5"/>
    <path fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round" d="M15 50.5 24 40"/>
  </g>
</svg>
