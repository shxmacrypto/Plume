<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plume Notepad: a lined sheet with the Plume feather writing on it, on warm sand. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e3c1"/>
      <stop offset=".5" stop-color="#c8894e"/>
      <stop offset="1" stop-color="#7a4a22"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f" gradientUnits="userSpaceOnUse" x1="48" y1="12" x2="16" y2="50">
      <stop offset="0" stop-color="#e0a86e"/>
      <stop offset="1" stop-color="#7a4a22"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#g)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#s)"/>
  <!-- the sheet, its top corner folded -->
  <path fill="#fff" d="M17 11h22l9 9v29a4 4 0 0 1-4 4H17a4 4 0 0 1-4-4V15a4 4 0 0 1 4-4z"/>
  <path fill="#ecd3ad" d="M39 11v6a3 3 0 0 0 3 3h6z"/>
  <!-- written lines -->
  <path fill="none" stroke="#c8894e" stroke-width="2.6" stroke-linecap="round" d="M19.5 25h15M19.5 32h21M19.5 39h12"/>
  <!-- the feather, writing the last line -->
  <g transform="translate(22.1 5.7) scale(.66)">
    <path fill="url(#f)" d="M48.5 12.5c-12.6 1.2-23.4 9.6-26.6 22.4l-1.4 6.6 6.4-1.6c4.6-1.2 8.6-3.6 11.6-7.2l-6.2-.6 8.8-3.6c3.8-4.6 7-10 7.4-16z"/>
    <path fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" d="M25 37.5C30 28 36 21 44.5 15.5"/>
    <path fill="none" stroke="url(#f)" stroke-width="3.8" stroke-linecap="round" d="M15 50.5 33.5 29"/>
  </g>
</svg>
