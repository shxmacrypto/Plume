<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plume Clean: a drive's space as a ring, the Plume feather sweeping beside it, two sparkles, on lime to emerald. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f99d"/>
      <stop offset=".5" stop-color="#84cc16"/>
      <stop offset="1" stop-color="#3f6212"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#g)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#s)"/>
  <!-- the space: a ring, three quarters used, the free quarter fainter -->
  <circle cx="24" cy="25" r="12" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="6"/>
  <circle cx="24" cy="25" r="12" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="52 75.4" transform="rotate(-90 24 25)"/>
  <!-- the feather, its quill down to the left, sweeping -->
  <g transform="translate(21 17) scale(.76)">
    <path fill="#fff" d="M48.5 12.5c-12.6 1.2-23.4 9.6-26.6 22.4l-1.4 6.6 6.4-1.6c4.6-1.2 8.6-3.6 11.6-7.2l-6.2-.6 8.8-3.6c3.8-4.6 7-10 7.4-16z"/>
    <path fill="none" stroke="#65a30d" stroke-width="2.6" stroke-linecap="round" d="M25 37.5C30 28 36 21 44.5 15.5"/>
    <path fill="none" stroke="#fff" stroke-width="4.8" stroke-linecap="round" d="M15 50.5 24 40"/>
  </g>
  <!-- what it swept: two sparkles -->
  <path fill="#fff" d="M15 42.5c.5 2.9 1.6 4 4.5 4.5-2.9.5-4 1.6-4.5 4.5-.5-2.9-1.6-4-4.5-4.5 2.9-.5 4-1.6 4.5-4.5z"/>
  <path fill="#fff" fill-opacity=".8" d="M25.5 51.5c.3 1.6.9 2.2 2.5 2.5-1.6.3-2.2.9-2.5 2.5-.3-1.6-.9-2.2-2.5-2.5 1.6-.3 2.2-.9 2.5-2.5z"/>
</svg>
