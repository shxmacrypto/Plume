<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plume Music: an eighth note whose flag is the Plume feather, on rose to violet. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b8b"/>
      <stop offset=".5" stop-color="#fb3e6e"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#g)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#s)"/>
  <!-- the flag: the feather, from the top of the stem down to the right -->
  <g transform="translate(29.4 12.2) rotate(95) scale(.74) translate(-15 -50.5)">
    <path fill="#fff" d="M48.5 12.5c-12.6 1.2-23.4 9.6-26.6 22.4l-1.4 6.6 6.4-1.6c4.6-1.2 8.6-3.6 11.6-7.2l-6.2-.6 8.8-3.6c3.8-4.6 7-10 7.4-16z"/>
    <path fill="none" stroke="#fb3e6e" stroke-width="2.4" stroke-linecap="round" d="M25 37.5C30 28 36 21 44.5 15.5"/>
    <path fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round" d="M15 50.5 24 40"/>
  </g>
  <!-- the stem and the head -->
  <rect x="27.4" y="11.5" width="3.8" height="36" rx="1.9" fill="#fff"/>
  <ellipse cx="21.6" cy="47.6" rx="9" ry="6.8" transform="rotate(-22 21.6 47.6)" fill="#fff"/>
</svg>
