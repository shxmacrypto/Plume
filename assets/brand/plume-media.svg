<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plume Media: a photo whose sky holds the Plume feather, a play button on its corner, on lime to emerald. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset=".5" stop-color="#eab308"/>
      <stop offset="1" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f" gradientUnits="userSpaceOnUse" x1="44" y1="14" x2="12" y2="46">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#g)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#s)"/>
  <!-- the photo -->
  <rect x="8" y="13" width="40" height="33" rx="5.5" fill="#fff"/>
  <!-- the feather, half size, in its sky -->
  <g transform="translate(10 9.6) scale(.46)">
    <path fill="url(#f)" d="M48.5 12.5c-12.6 1.2-23.4 9.6-26.6 22.4l-1.4 6.6 6.4-1.6c4.6-1.2 8.6-3.6 11.6-7.2l-6.2-.6 8.8-3.6c3.8-4.6 7-10 7.4-16z"/>
    <path fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" d="M25 37.5C30 28 36 21 44.5 15.5"/>
    <path fill="none" stroke="url(#f)" stroke-width="3.8" stroke-linecap="round" d="M15 50.5 24 40"/>
  </g>
  <!-- the hills -->
  <path fill="url(#f)" d="M12.5 42.5 21 34.2a1.6 1.6 0 0 1 2.2 0l5.3 5.1 3.6-3.4a1.6 1.6 0 0 1 2.2 0l7.2 6.6z" opacity=".9"/>
  <!-- the play button over the corner -->
  <circle cx="46" cy="44.5" r="11.5" fill="#ca8a04"/>
  <circle cx="46" cy="44.5" r="9.5" fill="#fff"/>
  <path fill="url(#f)" d="M43.4 39.9v9.2c0 .8.9 1.3 1.6.9l7.2-4.6c.6-.4.6-1.3 0-1.7L45 39.1c-.7-.5-1.6 0-1.6.8z"/>
</svg>
