<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plume Mail: an envelope sealed with the Plume feather, on rose. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fb1"/>
      <stop offset=".5" stop-color="#ff375f"/>
      <stop offset="1" stop-color="#c2279b"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f" gradientUnits="userSpaceOnUse" x1="48" y1="12" x2="16" y2="50">
      <stop offset="0" stop-color="#ff5c7f"/>
      <stop offset="1" stop-color="#c2279b"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#g)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#s)"/>
  <!-- envelope -->
  <rect x="11.5" y="18.5" width="41" height="28" rx="5" fill="#fff"/>
  <path fill="none" stroke="#ff4d73" stroke-opacity=".8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M14.5 22.5 29.6 32.6a4.2 4.2 0 0 0 4.8 0L49.5 22.5"/>
  <!-- the feather, small, in the corner of the letter -->
