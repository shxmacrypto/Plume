<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plume Suite, round: for places that crop to a circle (Discord server icon, webhook avatars). Same feather and
       colours as plume-suite.svg, on a full graphite disc with the Plume gradient ring. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3e"/>
      <stop offset="1" stop-color="#151517"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64d2ff"/>
      <stop offset=".5" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#5e5ce6"/>
    </linearGradient>
    <linearGradient id="f" gradientUnits="userSpaceOnUse" x1="50" y1="12" x2="14" y2="52">
      <stop offset="0" stop-color="#7fdcff"/>
      <stop offset=".55" stop-color="#2f95ff"/>
      <stop offset="1" stop-color="#7d7aff"/>
    </linearGradient>
    <radialGradient id="s" cx=".3" cy=".2" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="32" fill="url(#s)"/>
  <circle cx="32" cy="32" r="30.6" fill="none" stroke="url(#g)" stroke-width="2.4"/>
  <g transform="translate(32 32) scale(0.8) translate(-31.75 -31.5)">
    <path fill="url(#f)" d="M48.5 12.5c-12.6 1.2-23.4 9.6-26.6 22.4l-1.4 6.6 6.4-1.6c4.6-1.2 8.6-3.6 11.6-7.2l-6.2-.6 8.8-3.6c3.8-4.6 7-10 7.4-16z"/>
    <path fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.5" stroke-linecap="round" d="M25 37.5C30 28 36 21 44.5 15.5"/>
    <path fill="none" stroke="url(#f)" stroke-width="3.2" stroke-linecap="round" d="M15 50.5 33.5 29"/>
  </g>
</svg>
