[package]
name = "plume-music"
version.workspace = true
edition = "2024"
build = "build.rs"
description = "Plume Music: your music, YouTube's catalog and your imported playlists, with synced lyrics, in one light native player."
license = "MIT"

[[bin]]
name = "plume-music"
path = "src/main.rs"

[features]
# Prise d'essai (pilotage de la fenêtre par un script, sur 127.0.0.1) : jamais dans une version publiée.
test-hook = ["plume-ui/test-hook"]

[dependencies]
plume-ui = { path = "../../crates/plume-ui" }
plume-update = { path = "../../crates/plume-update" }
serde_json = "1"
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "alac", "pcm", "adpcm"] }
lofty = "0.22"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
miniz_oxide = "0.8"
windows-numerics = "0.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Networking_WinInet",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Media",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
