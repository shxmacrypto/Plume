[package]
name = "plume-fex"
version.workspace = true
edition = "2024"
build = "build.rs"
description = "Plume FEx: a fast, native file explorer for Windows 10 and 11, with Everything-style search."
license = "MIT"

[[bin]]
name = "plume-fex"
path = "src/main.rs"

[features]
# Prise d'essai (pilotage de la fenêtre par un script, sur 127.0.0.1) : jamais dans une version publiée.
test-hook = ["plume-ui/test-hook"]

[dependencies]
fex-core = { path = "../../crates/fex-core" }
plume-ui = { path = "../../crates/plume-ui" }
plume-update = { path = "../../crates/plume-update" }
serde_json = "1"
# ZIP with a password (AES-256), read and written in the program itself: no C code, no extra compression formats
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
# 7z with a password (AES-256, file names hidden), read and written here too, in Rust
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "compress", "util", "bzip2", "ppmd"] }
windows-core = "0.61"
windows-numerics = "0.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
