[package]
name = "plume-pdf"
version.workspace = true
edition = "2024"
build = "build.rs"
description = "Plume PDF: open, annotate, sign and merge PDF files."
license = "MIT"

[[bin]]
name = "plume-pdf"
path = "src/main.rs"

[features]
# Prise d'essai (pilotage de la fenêtre par un script, sur 127.0.0.1) : jamais dans une version publiée.
test-hook = ["plume-ui/test-hook"]

[dependencies]
plume-ui = { path = "../../crates/plume-ui" }
plume-update = { path = "../../crates/plume-update" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# pure Rust: no chrono, no rayon (nothing compiles C)
lopdf = { version = "0.47", default-features = false }
windows-numerics = "0.2"
windows = { version = "0.61", features = [
    "Data_Pdf",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "UI",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
