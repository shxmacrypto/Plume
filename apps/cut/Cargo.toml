[package]
name = "plume-cut"
version.workspace = true
edition = "2024"
build = "build.rs"
description = "Plume Cut: cut, arrange and export your videos, on this PC."
license = "MIT"

[[bin]]
name = "plume-cut"
path = "src/main.rs"

[features]
# Test socket (a script drives the window on 127.0.0.1): never in a published build.
test-hook = ["plume-ui/test-hook"]

[dependencies]
plume-defaults = { path = "../../crates/plume-defaults" }
plume-ui = { path = "../../crates/plume-ui" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
miniz_oxide = "0.8"
windows-numerics = "0.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Networking_WinInet",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
