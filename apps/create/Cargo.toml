[package]
name = "plume-create"
version.workspace = true
edition = "2024"
build = "build.rs"
description = "Plume Create: photo editing and graphic design in one native app."
license = "MIT"

[[bin]]
name = "plume-create"
path = "src/main.rs"

[features]
# Prise d'essai (pilotage de la fenêtre par un script, sur 127.0.0.1) : jamais dans une version publiée.
test-hook = ["plume-ui/test-hook"]

[dependencies]
plume-defaults = { path = "../../crates/plume-defaults" }
plume-ui = { path = "../../crates/plume-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
image-webp = "0.2"
windows-numerics = "0.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
