[package]
name = "plume-mail"
version.workspace = true
edition = "2024"
build = "build.rs"
description = "Plume Mail: a fast, native mail app for Windows 10 and 11."
license = "MIT"

[[bin]]
name = "plume-mail"
path = "src/main.rs"

[features]
# Prise d'essai (pilotage de la fenêtre par un script, sur 127.0.0.1) : jamais dans une version publiée.
test-hook = ["mail-core/test-hook", "plume-ui/test-hook"]

[dependencies]
mail-core = { path = "../../crates/mail-core" }
plume-ui = { path = "../../crates/plume-ui" }
plume-update = { path = "../../crates/plume-update" }
serde_json = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Imaging",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
] }
