[package]
name = "plume-viewer"
version.workspace = true
edition = "2024"
build = "build.rs"
description = "Plume Viewer: see and control this PC from a phone or any browser, with a QR code or an ID and a code."
license = "MIT"

[[bin]]
name = "plume-viewer"
path = "src/main.rs"

[features]
# Prise d'essai (pilotage de la fenêtre par un script, sur 127.0.0.1) : jamais dans une version publiée.
test-hook = ["plume-ui/test-hook"]

[dependencies]
plume-ui = { path = "../../crates/plume-ui" }
plume-update = { path = "../../crates/plume-update" }
serde_json = "1"
str0m = { version = "0.25.0", default-features = false, features = ["wincrypto"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "native-tls"] }
qrcode = { version = "0.14.1", default-features = false }
sha2 = "0.10.9"
hmac = "0.12.1"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
getrandom = "0.3.4"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
