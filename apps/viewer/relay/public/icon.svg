<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plume Viewer: a screen showing the Plume feather, a mouse pointer clicking on it, on teal. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset=".5" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f" gradientUnits="userSpaceOnUse" x1="48" y1="12" x2="16" y2="50">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#g)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#s)"/>
  <!-- the screen, its foot -->
  <rect x="10" y="13" width="44" height="30" rx="4.5" fill="#fff"/>
  <path fill="#fff" fill-opacity=".72" d="M27.5 43h9l1.4 5.5h-11.8z"/>
  <rect x="21" y="48" width="22" height="3.2" rx="1.6" fill="#fff" fill-opacity=".72"/>
  <!-- the feather on the screen, half size -->
  <g transform="translate(16.2 12.2) scale(.5)">
    <path fill="url(#f)" d="M48.5 12.5c-12.6 1.2-23.4 9.6-26.6 22.4l-1.4 6.6 6.4-1.6c4.6-1.2 8.6-3.6 11.6-7.2l-6.2-.6 8.8-3.6c3.8-4.6 7-10 7.4-16z"/>
    <path fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" d="M25 37.5C30 28 36 21 44.5 15.5"/>
    <path fill="none" stroke="url(#f)" stroke-width="3.6" stroke-linecap="round" d="M15 50.5 33.5 29"/>
  </g>
  <!-- the click: three short strokes around the tip of the pointer -->
  <g stroke="#0e7490" stroke-width="1.9" stroke-linecap="round" fill="none">
    <path d="M38.2 27.2 36.4 25.4"/>
    <path d="M41.2 25.9V23.4"/>
    <path d="M35.2 30.6H32.8"/>
  </g>
  <!-- the pointer, white with a dark teal edge, its tip on the screen -->
  <path fill="#fff" stroke="#0e7490" stroke-width="2.2" stroke-linejoin="round" d="M40.5 30.5 41 52.2l5.2-5.3 3.8 8.2 4-1.8-3.8-8.1 7.4-.2z"/>
</svg>
